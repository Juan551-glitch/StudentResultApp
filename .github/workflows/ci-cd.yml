name: SRMS GitHub Actions CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore Packages
        run: dotnet restore StudentResultApp/StudentResultApp.csproj

      - name: Build Application
        run: dotnet build StudentResultApp/StudentResultApp.csproj --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test StudentResultApp.Tests/StudentResultApp.Tests.csproj --configuration Release --filter "FullyQualifiedName!~StudentResultUiTests"

      - name: Publish Application
        run: dotnet publish StudentResultApp/StudentResultApp.csproj --configuration Release --output ./publish

      - name: Deploy Stage
        run: echo "Deployment completed successfully"